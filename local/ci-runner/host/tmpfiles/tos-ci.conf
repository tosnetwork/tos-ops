# Runtime directories. A slot's directory is setgid to that slot's group, so
# the admission socket the supervisor creates there is reachable by that
# slot's QEMU and by no other slot.
d /run/tos-ci 0755 root root -
d /run/tos-ci/slot1 2750 tos-ci tos-ci-slot1 -
d /run/tos-ci/slot2 2750 tos-ci tos-ci-slot2 -
d /run/tos-ci/slot3 2750 tos-ci tos-ci-slot3 -
d /run/tos-ci/build 0750 root root -
